# SRIP Track 2 filter — tunable configuration (PRD §10.3).
# Every magic number in the pipeline lives here; logic reads these, never hard-codes them.
# Secrets (OPENAI_API_KEY) are NOT in this file — they come from .env (see .env.example).

# Essay length gate — units are words.
# ⚠️ DEAD for v3: the length gate was deleted (the site 400s violations at submit and sends
# no bounds). run_essay_gates_v3 pins hard_fail=False and zero penalty; word counts are audit
# data only. These knobs are still read by the v2 CSV-batch path, which survives only to keep
# tests/test_pipeline.py's gate coverage alive. Changing them affects nothing in production.
essay_length:
  target_min: 100
  target_max: 350
  hard_min: 60          # word count < this -> REJECTED
  hard_max: 500         # word count > this -> REJECTED
  len_penalty_max: 5    # max soft penalty applied near the hard bounds

# Gibberish heuristics (Stage 1, §4.2) — cheap, no dictionary. ESL-safe: a hit needs
# >= min_signals of the signals below to fire together (one alone never rejects).
gibberish:
  min_signals: 2
  max_consonant_run: 7        # consonant run longer than this -> signal
  min_char_entropy: 2.5       # letter entropy below this (asdfasdf / aaaaaa) -> signal
  max_repeat_run: 5           # a run of one identical char this long -> signal
  min_unique_word_ratio: 0.3  # unique/total words below this -> signal
  min_words_for_ratio: 20     # only score the unique-word ratio with >= this many words
  min_chars: 20               # below this many letters, skip detection (too little signal)

# GPA gate + gradient (Stages 2-3, §8.1)
gpa:
  threshold: 3.3        # deny line AND bottom of the scoring gradient (owner, 2026-06-12)
  hard_floor: 2.0       # below this no explanation can rescue -> REJECTED (no Task B call)
  score_max: 40         # points awarded at a normalized GPA of 4.0
  # Deterministic normalization (Stage 2, §6.1). A bare value above gpa_max is treated as
  # weighted/out-of-scale and routed to LLM Task A; the percentage table maps detectable
  # percentages (and /10 scales x10) onto the 4.0 scale, linear toward 0 below the lowest band.
  normalization:
    gpa_max: 4.0
    percentage_max: 100
    percentage_table:   # percentage >= min_pct maps to gpa; the 87 row is the 3.3 threshold
      - {min_pct: 93, gpa: 4.0}
      - {min_pct: 90, gpa: 3.7}
      - {min_pct: 87, gpa: 3.3}
      - {min_pct: 83, gpa: 3.0}
      - {min_pct: 80, gpa: 2.7}
      - {min_pct: 77, gpa: 2.3}
      - {min_pct: 73, gpa: 2.0}

# Essay quality scoring (Stage 4, Task D) — v3: 15 each (SCORING.md, owner 2026-07-04)
essay_scoring:
  quality_max_each: 15  # per required essay; 30 total
  grammar_penalty_max: 3

# Technical-essay bonus (Stage 4b, Task F — NEW in v3, SCORING.md). Bonus-only: absent,
# gibberish, off-topic, or over-max essay => 0, never a rejection (profanity is a Stage-1
# reject like any essay). The model judges three 0-10 signals; this config prices them:
# bonus = bonus_max * (w_depth*d + w_expl*e + w_impact*i) / (10 * (w_depth+w_expl+w_impact)).
technical_essay:
  bonus_max: 20
  weight_depth: 1.0        # technical depth / difficulty
  weight_exploration: 1.0  # sustained exploration beyond the classroom
  weight_impact: 1.0       # real-world impact (interest -> side project -> impact = high)

# Coursework bonus (Stage 5, Task C) — additive only, never subtracts. Grades are ignored
# unless explicitly stated below the grade floor (min_grade_pct): such a course is excluded
# entirely; any other counting course contributes a flat weight * unit (grade never scales it).
coursework:
  bonus_max: 15
  weight_cs: 1.0
  weight_math: 0.8
  weight_data: 0.6
  weight_other: 0.0
  min_grade_pct: 80     # an explicit grade below this excludes the course entirely
  unit: 3.0

# School bonus (Stage 7) — additive only, never subtracts. v3: 20/16 (SCORING.md).
school:
  bonus_us_top20: 20
  bonus_intl_top50: 16
  fuzzy_match_threshold: 88

# Resume bonus (Stage 6) — additive only, never subtracts. In-house rubric: Task E extracts
# signals, the weight_* knobs price them (model counts, config prices), sum capped at
# bonus_max. allowed_url_hosts is the https-only SSRF allowlist.
#
# bonus_max: 0 is the kill switch AND the shipping default — zero fetches, zero tokens.
# The weights below are priced for the 0-25 scale. ONE thing is still outstanding before
# bonus_max can be raised to 25: re-pin allowed_url_hosts to the website's R2 host
# (`<R2_ACCOUNT_ID>.r2.cloudflarestorage.com`) — the entry below is the retired v2 Fillout
# bucket, and the allowlist is exact-host, so an unpinned host simply never fetches.
#
# Weight calibration (owner, 2026-07-30): the v2 weights were tuned for a 10-point band and
# were carried over unscaled, so they under-priced everything against a 25-point cap — an
# exceptional resume reached only ~56% of the band. Every weight is the v2 value x2.5, which
# moves the approved *shape* onto the new maximum rather than re-deciding it. Where realistic
# applicant profiles land (pinned by tests/scoring/test_resume.py):
#   1 project, skills 0.3                         ->  5.25 / 25   (21%)
#   2 projects, 1 award, skills 0.5               -> 12.5  / 25   (50%)
#   3 projects, 1 internship, 1 award, skills 0.8 -> 22.75 / 25   (91%)
#   4 projects, 2 internships, 2 awards, skills 1 -> 35.0 -> capped at 25
# Saturation at the top is intended: this is a bonus band, and a standout resume earns all of
# it. Counts are unbounded, so the weights alone decide where real resumes land.
resume:
  bonus_max: 0
  max_download_bytes: 10485760   # 10 MiB streaming cap per resume; abort above this
  download_timeout_s: 20.0
  download_concurrency: 4        # download semaphore, separate from the LLM one
  allowed_url_hosts:
    - prod-fillout-oregon-s3.s3.us-west-2.amazonaws.com
  max_text_chars: 15000          # extracted-text cap; bounds Task E token spend
  weight_project: 3.75           # per relevant software/CS/data project
  weight_experience: 5.0         # per relevant internship/job/research entry
  weight_award: 2.5              # per relevant award/competition placement
  weight_skills: 5.0             # x skills_relevance (0-1)

# Cohort assignment (Phase 11, PRD §11) — downstream of ranking. Tier tokens are matched
# case-insensitively inside the free-text choice strings ("Summer 2026- HONORS" etc.).
# ORDER IS LOAD-BEARING: competitiveness/cost order, most expensive first — the cost ceiling
# ("never place a student above their first choice") is computed from list position. Per-tier
# capacities are a per-request staff input on the cohort endpoints, NOT config.
cohort:
  tiers: [honors, intensive, regular]

# LLM tasks (OpenAI). Model IDs are pinned here and swappable — verify against OpenAI's catalog.
llm:
  models:
    task_a: gpt-4.1-mini   # A: GPA normalization (mechanical extraction)
    task_b: gpt-4.1        # B: low-GPA explanation adequacy (judgment, can reject)
    task_c: gpt-4.1-mini   # C: coursework decomposition (mechanical extraction)
    task_d: gpt-4.1        # D: essay grading / gibberish / relevance (judgment, can reject)
    task_e: gpt-4.1-mini   # E: resume signal extraction (mechanical extraction, Phase 12)
    task_f: gpt-4.1        # F: technical-essay bonus (judgment, bonus-only — NEW in v3)
  temperature: 0.2         # <= 0.2 for repeatability
  max_concurrency: 8       # bound for the asyncio.Semaphore around LLM calls
  # ⚠️ SET tokens_per_minute TO THE DEPLOYMENT ACCOUNT'S ACTUAL gpt-4.1 TPM LIMIT.
  # This paces requests so the token ceiling is never breached, which is what lets a batch of
  # applications be graded *slower* rather than *lossily*. 0 disables pacing.
  # The default below is OpenAI's tier-1 figure — the most restrictive real limit, and what
  # produced the 2026-07-29 incident when pacing did not exist. Measured cost of leaving it
  # too low: ~1k tokens per essay call, so 30k TPM grades roughly 8 applications/minute.
  tokens_per_minute: 30000
  estimated_output_tokens: 400   # output allowance added to the prompt estimate when pacing
  max_retries: 2           # retries INSIDE the OpenAI SDK (it honours Retry-After)
  # Our own budget for transient failures (429 / timeout / connection / 5xx), exponential
  # backoff capped at backoff_max_s. Measured 2026-07-29: at 2 attempts a 30k-TPM ceiling
  # turned 307 of 466 real applications into NEEDS_REVIEW. A rate limit is our problem, not
  # the applicant's. Terminal failures (unparseable output) still get one retry, per PRD §8.
  max_attempts: 6
  backoff_max_s: 30.0
  request_timeout_s: 60.0

# Persistence (P1, PRD v3 §1.1) — asyncpg pool sizing only. The DATABASE_URL DSN is a
# secret (credentials inside) and comes from .env / the host's env store, never this file.
# P11.4: sized for serverless — many short-lived instances against Neon's POOLED
# (-pooler) endpoint. create_pool also pins statement_cache_size=0, without which
# asyncpg breaks intermittently against PgBouncer's transaction mode.
db:
  pool_min_size: 0
  pool_max_size: 2

# Webhook edge (P2/P10). Secrets (ATS_WEBHOOK_SECRET[_PREVIOUS]) come from env and are
# compared constant-time against the partner's static X-ATS-Secret header.
webhook:
  max_body_bytes: 1048576   # 1 MiB cap on a single application payload -> 413 above

# Grading worker (P3, PRD v3 §3) — drains the applications status queue.
worker:
  poll_seconds: 2.0         # idle sleep between queue polls; stop wakes it immediately
  # Cron drain (P11.1/11.2) — the serverless driver. Budget sits inside Vercel's 800 s
  # maxDuration; stale_grading_seconds must exceed the slowest realistic single-row grade.
  drain_budget_seconds: 600.0
  drain_max_rows: 50
  stale_grading_seconds: 900.0
  # /health goes "degraded" (503) once the oldest ungraded application is older than this.
  # Sized off drain throughput: at 50 rows/min a ~2000-application burst needs ~40 min to
  # clear, so a shorter window would false-alarm at the busiest moment of the cycle.
  queue_alert_seconds: 3600.0

# Admin sessions (P5, PRD v3 §6). ADMIN_PASSWORD_HASH lives in env, never here.
auth:
  # 2 h — P12.1 session cookies are stateless (signed, not stored), so nothing but expiry
  # retires a stolen one. Rotating the admin password invalidates every session at once.
  session_ttl_seconds: 7200.0
  # Two tiers, both counted over the same sliding window. Per-client is the one that
  # normally fires; the global tier is the distributed-guesser backstop, priced so that
  # ordinary abuse cannot reach it. When global was the ONLY tier, five wrong passwords
  # from anywhere locked every staff member out — for free, indefinitely.
  max_attempts: 5               # failed logins from ONE client before that client is locked
  max_attempts_global: 50       # failed logins from EVERY client before all logins refuse
  lockout_seconds: 300.0
  cookie_secure: true           # false only for local http:// development

# API edge caps (Phase 9) — the stateless FastAPI shell. Magic numbers, not in the handlers.
api:
  max_upload_bytes: 26214400  # 25 MiB cap on the uploaded decisions.jsonl body -> 413 above this
  max_rows: 2000              # parsed-record cap (PRD scale target) -> 413/422 above this
