[project]
name = "srip-filter"
version = "0.1.0"
description = "SRIP Track 2 application filtering & ranking system (stateless: reject + rank)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.50",  # client.chat.completions.parse (structured outputs) left beta in 1.50
    "rapidfuzz>=3.9",
    "better-profanity>=0.7",
    "pyyaml>=6.0.1",
    "httpx>=0.27",  # resume download layer (Phase 12); promoted from transitive (via openai)
    "pypdf>=4.2",  # resume PDF text extraction (Phase 12); lighter than pdfplumber
    "asyncpg>=0.31.0",
    # API layer. Was an optional `api` extra until P13.1: Vercel installs only the default
    # dependency set from pyproject, so an extra means a deploy with no web framework.
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",  # FastAPI multipart/form-data parsing (POST /cohorts)
    "jinja2>=3.1",  # server-rendered HTML templates; StaticFiles needs no aiofiles
]

# P13.1 — Vercel loads the ASGI app from here. `api/main.py` is already a path Vercel
# discovers on its own; naming it removes the ambiguity with src/ and documents the seam.
[tool.vercel]
entrypoint = "api.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    # Only `srip_filter.ingest` uses pandas, and that module exists only for
    # `scripts/replay.py` — a development tool. Nothing the deployed function imports
    # touches it, so keeping it out of the runtime set drops ~0.6 s from every serverless
    # cold start and its weight from the bundle.
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srip_filter"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_auth: exercise the real admin-auth barrier (others bypass it via conftest)",
]
